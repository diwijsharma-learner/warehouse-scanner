<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KD Warehouse Scanner</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#0f1117;color:#e8eaf0;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:0 0 40px;
  }

  /* HEADER */
  header{
    width:100%;background:#1a1d2e;
    border-bottom:1px solid #2a2e3d;
    padding:16px 20px;
    display:flex;align-items:center;gap:12px;
  }
  .logo{
    width:38px;height:38px;
    background:linear-gradient(135deg,#00e676,#6c63ff);
    border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  header h1{font-size:16px;letter-spacing:.03em;font-weight:700;}
  header p{font-size:11px;color:#8890a4;margin-top:2px;}

  .container{width:100%;max-width:420px;padding:20px 16px 0;}

  /* CAMERA BOX */
  .cam-box{
    background:#1a1d27;border:1px solid #2a2e3d;
    border-radius:16px;overflow:hidden;margin-bottom:18px;
  }
  .cam-box-title{
    padding:10px 14px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.08em;color:#8890a4;
    border-bottom:1px solid #2a2e3d;
  }
  .cam-viewport{position:relative;width:100%;background:#000;}
  #camVideo{width:100%;display:block;max-height:280px;object-fit:cover;}

  /* Target overlay */
  .target-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .target-box{width:72%;max-width:260px;height:130px;position:relative;}
  .target-box::before,.target-box::after,.tc-bl,.tc-tr{
    content:'';position:absolute;width:20px;height:20px;
    border-color:#00e676;border-style:solid;
  }
  .target-box::before{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
  .target-box::after {top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
  .tc-bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
  .tc-tr{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
  .scan-line{
    position:absolute;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#00e676,transparent);
    animation:sl 2s ease-in-out infinite;
  }
  @keyframes sl{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}

  /* Dark shade outside target */
  .sh{position:absolute;background:rgba(0,0,0,.5);}
  .sh-t{top:0;left:0;right:0;height:calc(50% - 65px);}
  .sh-b{bottom:0;left:0;right:0;height:calc(50% - 65px);}
  .sh-l{top:calc(50% - 65px);left:0;width:14%;height:130px;}
  .sh-r{top:calc(50% - 65px);right:0;width:14%;height:130px;}

  /* Status bar */
  .cam-status{
    padding:10px 14px;display:flex;align-items:center;gap:8px;
    border-top:1px solid #2a2e3d;font-size:12px;min-height:40px;
  }
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#8890a4;}
  .status-dot.searching{background:#ffc107;animation:blink .8s infinite;}
  .status-dot.found{background:#00e676;}
  .status-dot.error{background:#ff5252;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .status-text{flex:1;color:#8890a4;}
  .status-text.found{color:#00e676;font-weight:700;}
  .status-text.error{color:#ff5252;}

  /* Controls */
  .cam-controls{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #2a2e3d;}
  .ctrl-btn{
    flex:1;padding:9px;background:#20242f;border:1px solid #2a2e3d;
    border-radius:9px;color:#e8eaf0;font-size:13px;cursor:pointer;transition:all .2s;
  }
  .ctrl-btn:hover{border-color:#6c63ff;}
  .ctrl-btn.on{border-color:#00e676;color:#00e676;}
  #torchBtn{display:none;}

  /* START button */
  #startBtn{
    width:100%;padding:14px;background:linear-gradient(135deg,#00e676,#00c85a);
    border:none;border-radius:12px;color:#071a0e;font-size:14px;font-weight:700;
    cursor:pointer;margin-bottom:8px;letter-spacing:.04em;
  }
  #startBtn:active{transform:scale(.98);}

  /* Result box */
  .result-box{
    background:#1a1d27;border:1px solid #2a2e3d;
    border-radius:16px;padding:16px;margin-bottom:18px;
  }
  .result-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#8890a4;margin-bottom:8px;}
  .result-value{
    font-family:'Courier New',monospace;font-size:15px;font-weight:700;
    color:#00e676;word-break:break-all;min-height:24px;
    padding:10px 12px;background:#20242f;border-radius:8px;
    border:1px solid #2a2e3d;
  }
  .result-value.empty{color:#8890a4;font-size:12px;font-weight:400;}

  /* Copy & Clear buttons */
  .result-actions{display:flex;gap:8px;margin-top:10px;}
  .action-btn{
    flex:1;padding:9px;border:1px solid #2a2e3d;background:#20242f;
    border-radius:9px;color:#e8eaf0;font-size:12px;font-weight:600;
    cursor:pointer;transition:all .2s;
  }
  .action-btn:hover{border-color:#6c63ff;}
  .action-btn.copy-btn:hover{border-color:#00e676;color:#00e676;}
  .action-btn.clear-btn:hover{border-color:#ff5252;color:#ff5252;}

  /* History */
  .history-box{background:#1a1d27;border:1px solid #2a2e3d;border-radius:16px;padding:16px;}
  .history-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#8890a4;margin-bottom:10px;}
  .history-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
  .history-item{
    background:#20242f;border:1px solid #2a2e3d;border-radius:8px;
    padding:9px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;
    transition:border-color .2s;
  }
  .history-item:hover{border-color:#6c63ff;}
  .history-num{
    font-size:10px;font-weight:700;background:#2a2e3d;
    border-radius:4px;padding:2px 6px;color:#8890a4;flex-shrink:0;
  }
  .history-code{font-family:'Courier New',monospace;font-size:12px;font-weight:700;color:#e8eaf0;flex:1;word-break:break-all;}
  .history-time{font-size:10px;color:#8890a4;flex-shrink:0;}
  .history-empty{font-size:12px;color:#8890a4;text-align:center;padding:12px 0;}

  /* Toast */
  #toast{
    position:fixed;bottom:16px;left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#1a1d27;border:1px solid #2a2e3d;border-radius:50px;
    padding:10px 20px;font-size:12px;font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.6);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index:999;white-space:nowrap;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}
  #toast.success{border-color:#00e676;color:#00e676;}
  #toast.error{border-color:#ff5252;color:#ff5252;}
</style>
</head>
<body>

<header>
  <div class="logo">📦</div>
  <div>
    <h1>KD WAREHOUSE SCANNER</h1>
    <p id="hTime">Loading...</p>
  </div>
</header>

<div class="container">

  <!-- START BUTTON (shown before camera starts) -->
  <button id="startBtn" onclick="startCamera()">📷 Start Camera Scanner</button>
 <button id="galleryBtn"
onclick="document.getElementById('imagePicker').click()"
style="
width:100%;
padding:13px;
margin-bottom:14px;
background:#6c63ff;
border:none;
border-radius:12px;
color:white;
font-size:13px;
font-weight:700;
cursor:pointer;">
🖼 Scan From Gallery
</button>

<input
type="file"
id="imagePicker"
accept="image/*"
style="display:none"
onchange="scanImage(event)">

  <!-- CAMERA -->
  <div class="cam-box">
    <div class="cam-box-title">📷 Camera — Point at Barcode or QR Code</div>
    <div class="cam-viewport">
      <video id="camVideo" autoplay playsinline muted></video>
      <!-- Shade -->
      <div class="sh sh-t"></div><div class="sh sh-b"></div>
      <div class="sh sh-l"></div><div class="sh sh-r"></div>
      <!-- Target -->
      <div class="target-wrap">
        <div class="target-box">
          <div class="tc-bl"></div><div class="tc-tr"></div>
          <div class="scan-line"></div>
        </div>
      </div>
    </div>
    <!-- Status -->
    <div class="cam-status">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-text" id="statusText">Tap "Start Camera Scanner" above to begin</div>
    </div>
    <!-- Controls -->
    <div class="cam-controls">
      <button class="ctrl-btn" onclick="flipCamera()">🔄 Flip Camera</button>
      <button class="ctrl-btn" id="torchBtn" onclick="toggleTorch()">🔦 Torch</button>
      <button class="ctrl-btn" onclick="stopCamera()" style="color:#ff5252;">⏹ Stop</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="result-box">
    <div class="result-label">Last Scanned Result</div>
    <div class="result-value empty" id="resultVal">No scan yet — point camera at a barcode</div>
    <div class="result-actions">
      <button class="action-btn copy-btn" onclick="copyResult()">📋 Copy</button>
      <button class="action-btn clear-btn" onclick="clearResult()">🗑 Clear</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="history-box">
    <div class="history-title">Scan History (This Session)</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">No scans yet</div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
let videoStream = null;
let torchTrack  = null;
let torchOn     = false;
let scanning    = false;
let decodeInterval = null;
let useFrontCam = false;
let history     = [];
let lastResult  = "";

// Clock
setInterval(()=>{
  document.getElementById("hTime").textContent =
    new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
},1000);
document.getElementById("hTime").textContent =
  new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});

// ── Status helper ──────────────────────────────────────────
function setStatus(msg, state){
  document.getElementById("statusText").textContent = msg;
  document.getElementById("statusText").className = "status-text"+(state?" "+state:"");
  document.getElementById("statusDot").className  = "status-dot"+(state?" "+state:"");
}

// ── Start Camera ───────────────────────────────────────────
async function startCamera(){
  document.getElementById("startBtn").style.display = "none";
  setStatus("Starting camera...", "");
  stopCamera();

  const video = document.getElementById("camVideo");
  try{
    const constraints = {
      video:{
        facingMode: useFrontCam ? "user" : { ideal:"environment" },
        width:  { ideal:1280 },
        height: { ideal:720 }
      },
      audio: false
    };
    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = videoStream;
    await video.play();

    // Torch support
    const tracks = videoStream.getVideoTracks();
    if(tracks.length > 0 && !useFrontCam){
      torchTrack = tracks[0];
      const caps = torchTrack.getCapabilities ? torchTrack.getCapabilities() : {};
      if(caps.torch){
        document.getElementById("torchBtn").style.display = "";
      }
    }

    setStatus("🔍 Searching — point at barcode or QR code", "searching");
    scanning = true;
    startDecoding(video);

  } catch(err){
    document.getElementById("startBtn").style.display = "";
    console.error(err);
    if(err.name === "NotAllowedError"){
      setStatus("❌ Camera permission denied. Tap the 🔒 lock icon in your browser → Site Settings → Camera → Allow", "error");
    } else if(err.name === "NotFoundError"){
      setStatus("❌ No camera found on this device", "error");
    } else {
      setStatus("❌ " + err.name + ": " + err.message, "error");
    }
  }
}

// ── Stop Camera ────────────────────────────────────────────
function stopCamera(){
  scanning = false;
  if(decodeInterval){ clearInterval(decodeInterval); decodeInterval = null; }
  if(videoStream){ videoStream.getTracks().forEach(t=>t.stop()); videoStream = null; }
  document.getElementById("camVideo").srcObject = null;
  torchTrack = null; torchOn = false;
  document.getElementById("torchBtn").className = "ctrl-btn";
}

// ── Decode ─────────────────────────────────────────────────
function startDecoding(video){
  if("BarcodeDetector" in window){
    // Native API — fastest on Android Chrome
    const det = new BarcodeDetector({
      formats:[
        "qr_code","code_128","code_39","code_93",
        "ean_13","ean_8","upc_a","upc_e",
        "data_matrix","itf","codabar","aztec","pdf417"
      ]
    });
    decodeInterval = setInterval(async()=>{
      if(!scanning || video.readyState < 2) return;
      try{
        const results = await det.detect(video);
        if(results.length > 0) onFound(results[0].rawValue);
      } catch(e){}
    }, 150); // fast scan — every 150ms

  } else {
    // ZXing fallback for Safari / older browsers
    loadZXing(video);
  }
}

function loadZXing(video){
  setStatus("🔄 Loading scanner library...", "searching");
  if(window._zxingReady){ startZXing(video); return; }
  const sc = document.createElement("script");
  sc.src = "https://unpkg.com/@zxing/browser@latest/umd/index.min.js";
  sc.onload = ()=>{ window._zxingReady=true; startZXing(video); };
  sc.onerror = ()=>{
    const sc2 = document.createElement("script");
    sc2.src = "https://cdn.jsdelivr.net/npm/@zxing/browser@latest/umd/index.min.js";
    sc2.onload = ()=>{ window._zxingReady=true; startZXing(video); };
    sc2.onerror = ()=> setStatus("⚠️ Scanner library failed to load. Please try refreshing.", "error");
    document.head.appendChild(sc2);
  };
  document.head.appendChild(sc);
}

function startZXing(video){
  setStatus("🔍 Searching — point at barcode or QR code", "searching");
  try{
    const reader = new ZXingBrowser.BrowserMultiFormatReader();
    decodeInterval = setInterval(()=>{
      if(!scanning) return;
      reader.decodeFromVideoElement(video)
        .then(r=>{ if(r && scanning) onFound(r.getText()); })
        .catch(()=>{});
    }, 300);
  } catch(e){
    setStatus("⚠️ Could not start decoder. Try a different browser.", "error");
  }
}

// ── On code found ──────────────────────────────────────────
function onFound(text){
  if(!text || text === lastResult) return;
  lastResult = text;

  // Vibrate
  if(navigator.vibrate) navigator.vibrate([100,50,100]);

  // Update result display
  const rv = document.getElementById("resultVal");
  rv.textContent = text;
  rv.className = "result-value";

  // Status
  setStatus("✅ Scanned: " + text, "found");

  // Add to history
  const time = new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  history.unshift({ code: text, time });
  if(history.length > 50) history.pop();
  renderHistory();

  toast("✅ Scanned!", "success");

  // Resume scanning after 2 seconds (allows rescanning different code)
  setTimeout(()=>{
    lastResult = "";
    if(scanning) setStatus("🔍 Searching — point at next barcode", "searching");
  }, 2000);
}

// ── Flip Camera ────────────────────────────────────────────
function flipCamera(){
  useFrontCam = !useFrontCam;
  startCamera();
}

// ── Torch ──────────────────────────────────────────────────
async function toggleTorch(){
  if(!torchTrack) return;
  torchOn = !torchOn;
  try{
    await torchTrack.applyConstraints({ advanced:[{ torch: torchOn }] });
    document.getElementById("torchBtn").className = "ctrl-btn"+(torchOn?" on":"");
  } catch(e){ toast("Torch not supported", "error"); }
}

// ── Copy result ────────────────────────────────────────────
function copyResult(){
  const text = document.getElementById("resultVal").textContent;
  if(!text || text.includes("No scan yet")){ toast("Nothing to copy","error"); return; }
  navigator.clipboard.writeText(text)
    .then(()=> toast("📋 Copied!", "success"))
    .catch(()=>{
      // Fallback for older browsers
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy");
      document.body.removeChild(ta);
      toast("📋 Copied!", "success");
    });
}

// ── Clear ──────────────────────────────────────────────────
function clearResult(){
  document.getElementById("resultVal").textContent = "No scan yet — point camera at a barcode";
  document.getElementById("resultVal").className = "result-value empty";
  lastResult = "";
  setStatus("🔍 Searching — point at barcode or QR code", "searching");
}

// ── History ────────────────────────────────────────────────
function renderHistory(){
  const list = document.getElementById("historyList");
  if(!history.length){ list.innerHTML='<div class="history-empty">No scans yet</div>'; return; }
  list.innerHTML = history.map((h,i)=>`
    <div class="history-item" onclick="selectHistory('${esc(h.code)}')">
      <span class="history-num">#${history.length - i}</span>
      <span class="history-code">${esc(h.code)}</span>
      <span class="history-time">${h.time}</span>
    </div>`).join("");
}

function selectHistory(code){
  document.getElementById("resultVal").textContent = code;
  document.getElementById("resultVal").className = "result-value";
  toast("✅ Selected from history", "success");
}

// ── Toast ──────────────────────────────────────────────────
function toast(msg, type){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show "+(type||"");
  setTimeout(()=> t.className = "", 2500);
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
</script>
</body>
</html>
